# Spring Application Name
spring.application.name=gateway-service

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka

# Port Configuration
server.port=8765

# Spring Cloud Gateway Configuration
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Service Operations API
springdoc.swagger-ui.urls[0].url=/service-operations/v3/api-docs
springdoc.swagger-ui.urls[1].name=Workshop Service API
springdoc.swagger-ui.urls[1].url=/workshops-management/v3/api-docs
springdoc.swagger-ui.urls[2].name=File Management API
springdoc.swagger-ui.urls[2].url=/file-management/v3/api-docs
springdoc.swagger-ui.urls[3].name=Schedule Management API
springdoc.swagger-ui.urls[3].url=/scheduling-management/v3/api-docs
springdoc.swagger-ui.urls[4].name=Staff Management API
springdoc.swagger-ui.urls[4].url=/staff-management/v3/api-docs
springdoc.swagger-ui.urls[5].name=Profile Management API
springdoc.swagger-ui.urls[5].url=/profile-management/v3/api-docs
